# fly.toml - Fly.io configuration for Sai ReadyMix Concrete Backend
app = "rmc-backend"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  FLASK_ENV = "production"
  PORT = "8080"
  PYTHONUNBUFFERED = "1"
  SECRET_KEY = "rmc-production-secret-key-live"
  JWT_SECRET_KEY = "rmc-jwt-production-secret-key-live"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1

# To enable persistent SQLite storage without managing Postgres:
# Run: fly volumes create rmc_data --size 1 --region bom
# Then uncomment the two lines below:
# [mounts]
#   source = "rmc_data"
#   destination = "/data"

[[services.http_checks]]
  interval = "15s"
  timeout = "3s"
  grace_period = "10s"
  restart_limit = 0
  method = "get"
  path = "/health"
